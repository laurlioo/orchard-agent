# Render 部署配置
# 在 Render 新建 Web Service，选择 Python，根目录设为 backend/
# 环境变量需在 Render 控制台配置：DEEPSEEK_API_KEY、DEEPSEEK_BASE_URL、DEEPSEEK_MODEL、CORS_ORIGINS
services:
  - type: web
    name: orchard-agent-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false  # 需要手动在 Render 控制台填入
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app  # 部署后替换为你的 Vercel 域名
      - key: DB_PATH
        value: ./orchard.db
