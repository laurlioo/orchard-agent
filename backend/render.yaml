# Render 部署配置
# 在 Render 新建 Web Service，选择 Python，根目录设为 backend/
# 环境变量需在 Render 控制台配置：DEEPSEEK_API_KEY、DEEPSEEK_BASE_URL、DEEPSEEK_MODEL、CORS_ORIGINS、DATABASE_URL
services:
  - type: web
    name: orchard-agent-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: SETUP_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://orchard-agent-omega.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: DB_PATH
        value: ./orchard.db
